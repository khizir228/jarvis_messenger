services:
  - type: web
    name: jarvis-messenger
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
